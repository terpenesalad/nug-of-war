name: Preview screenshots

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  shots:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: "8.14.3"
      - name: Fetch androidx.test classes
        working-directory: tools/preview
        run: |
          mkdir -p libs
          for a in test/monitor/1.7.2/monitor-1.7.2 test/core/1.6.1/core-1.6.1 tracing/tracing/1.1.0/tracing-1.1.0 test/services/storage/1.5.0/storage-1.5.0; do
            curl -sSfL -o x.aar "https://dl.google.com/android/maven2/androidx/$a.aar"
            unzip -p x.aar classes.jar > "libs/$(basename $a).jar"
          done
          ls -la libs
      - name: Render screenshots
        working-directory: tools/preview
        run: gradle test --no-daemon
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: screenshots
          path: tools/preview/build/shots
      - name: Publish screenshots to the "preview" release
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd tools/preview/build/shots || exit 0
          zip -q ../shots.zip *.png
          gh release view preview >/dev/null 2>&1 || gh release create preview --title "Preview screenshots" --notes "Auto-rendered screenshots (not an APK release)." --prerelease --latest=false
          gh release upload preview ../shots.zip --clobber
